<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk QSO Data Entry</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        body { padding: 2rem; background: #f7f7f7; }
        .table-wrap { overflow-x: auto; }
        #bulkTable { min-width: 1450px; }
        #bulkTable input[type="text"] { min-width: 110px; }
        #bulkTable input[type="datetime-local"] { min-width: 190px; }
        #bulkTable .comments { min-width: 180px; }
        .result-cell { min-width: 180px; }
    </style>
</head>
<body>
    <main class="container-fluid">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
                <h1 class="h3 mb-1">Bulk QSO Data Entry</h1>
                <p class="text-muted mb-0">Edit existing QSOs or enter new paper records. Times are interpreted in this browser's local time.</p>
            </div>
            <a class="btn btn-outline-secondary" href="/">Back to Logger</a>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-body row g-3">
                <div class="col-md-6">
                    <label for="operatorName" class="form-label">Operator name</label>
                    <input id="operatorName" class="form-control" placeholder="Optional">
                </div>
                <div class="col-md-6">
                    <label for="filterCalls" class="form-label">Find a saved QSO</label>
                    <input id="filterCalls" class="form-control" placeholder="Filter by callsign or comments">
                </div>
            </div>
        </div>

        <div class="table-wrap bg-white border rounded shadow-sm">
            <table class="table table-striped align-middle mb-0" id="bulkTable">
                <thead>
                    <tr>
                        <th>Date and time</th>
                        <th>Callsign</th>
                        <th>Band</th>
                        <th>Mode</th>
                        <th>Sent</th>
                        <th>Received</th>
                        <th>Comments</th>
                        <th>Non-contest</th>
                        <th>QSL requested</th>
                        <th>Result</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-3">
            <button class="btn btn-outline-primary" id="addRow" type="button">Add Row</button>
            <button class="btn btn-primary" id="submitRows" type="button">Save New and Changed Rows</button>
        </div>
        <div id="summary" class="mt-3" role="status" aria-live="polite"></div>
    </main>

    <script src="/bulk-entry.js"></script>
</body>
</html>
